[[stages]]
id = "motive"
title = "The reason"
brief = """
You know who. A jury will want to know why.

**Name the murderer.** Reply with:  ACCUSE <surname>"""
question = "Who killed Sir Edmund Ashford?"
answers = ["nicholas", "nicholas ashford", "ashford, nicholas", "the nephew"]
hint = "Somebody was about to lose something, and knew the date they would lose it."
# Keystone pair: who inherits today, and who was about to inherit instead.
fragments = [
  """**EXHIBIT 3a — the will, executed 1931**
The whole of the Ashford estate, house and residue, to **Nicholas Ashford**, \
