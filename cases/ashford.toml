# ------------------------------------------------------------------ closing

[solution]
culprit = "Nicholas Ashford"
explanation = """
The study clock read 11:04 and ran eleven minutes fast: **10:53**. Iris had him \
alive at 10:30, so he died inside a twenty-three minute window.

Four alibis hold. Nicholas Ashford's was a telephone call logged from 22:22 to \
22:58 — but the house supply failed at 22:47 and the instrument at Ashford House \
is not battery-backed. The line was dead for the last eleven minutes of a call \
he says he was making. He left the receiver off its rest and went upstairs.

He was the sole heir under the 1931 will. Cardew & Sons were coming the morning \
after the vigil with a new one, leaving everything to the hospital trust. He owed \
four thousand pounds to men who had stopped being patient. He had one night."""
