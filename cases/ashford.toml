id = "ashford"
title = "The Ashford Vigil"
year = "1937"
blurb = """
Sir Edmund Ashford was found dead in his study during the annual vigil for his \
late wife. The storm had brought down the Bramley road by nine; nobody arrived \
after that, and nobody left. Five people were in the house.

You are the investigating team. The file has been split between you — each of \
you holds evidence the others cannot see, and no single fragment answers \
anything. Talk to each other."""

suspects = ["Marguerite Ashford", "Dr Peverell", "Thomas Vane", "Iris Coll", "Nicholas Ashford"]

# ---------------------------------------------------------------- stage one

[[stages]]
id = "clock"
title = "The hour"
brief = """
The study clock lay on its side by the desk, stopped. The coroner will not \
commit to a time without help.

**At what time did Sir Edmund die?** Answer to the minute."""
question = "At what time did Sir Edmund die?"
answers = ["10:53", "1053", "10.53", "ten fifty three", "ten fifty-three", "22:53"]
hint = "Two of you are holding a time. Only one of you knows whether to trust it."
# The first two are the keystone pair — see `deal()`. A time, and the reason not
# to trust it. Adjacent, so no single investigator is ever dealt both.
fragments = [
  """**EXHIBIT 1a — the study clock**
Mantel clock, brass, knocked from the desk during a struggle. The glass is \
cracked and the mechanism has stopped. The hands read **11:04**.""",

  """**EXHIBIT 1b — from the private diary of Thomas Vane, secretary**
"Tuesday. Spoke to Sir E. again about the study clock, which has run **eleven \
minutes fast** all week and which he refuses to have seen to. He says he likes \
being early. I say a clock that lies is worse than no clock at all.\"""",

  """**EXHIBIT 1c — statement of Iris Coll, housekeeper**
"I took Sir Edmund his tea and he thanked me for it, same as always. I know the \
time because the hall clock chimed the half hour as I came out — **half past \
ten**. He was alive then. I'd swear to that anywhere.\"""",

  """**EXHIBIT 1d — coroner's preliminary note**
"Death occurred between 10pm and midnight. Body temperature and lividity \
incline me to the earlier part of that window, though I would not swear to it \
in court." — Dr A. Peverell, house physician.""",

  """**EXHIBIT 1e — Bramley & District Electricity Board, fault log**
Supply to Ashford House failed at **22:47** and was not restored until 06:10 the \
following morning. Note: the hall clock at Ashford House is electric. The study \
clock is wound by hand.""",
]

