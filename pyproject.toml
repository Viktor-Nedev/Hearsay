[project]
name = "hearsay"
version = "0.1.0"
description = "A social deduction game where the messenger is the impostor. Players never share a channel; the agent relays every word, and sometimes rewrites it."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "caspian-sdk>=0.1.0",
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
hearsay = "hearsay.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hearsay*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
